[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellsight"
version = "0.1.0"
description = "Blood-cell image classification with a 7-backbone deep ensemble"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "pillow>=10.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "timm>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
cellsight = "cellsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellsight = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
